[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elite-rag"
version = "0.1.0"
description = "Zero-overlap, parent-child enterprise RAG for EnterpriseRAG-Bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.36,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<5",
  "openai>=1.60,<3",
  "psycopg[binary]>=3.3.5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "qdrant-client>=1.15,<2",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/elite_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["elite_rag"]
ignore_missing_imports = true
