[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elite-rag"
version = "0.2.0"
description = "Standalone hierarchical tri-vector RAG service and evaluation application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.36,<2",
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.25,<2",
  # RAGAS 0.4.3 imports VertexAI classes removed in langchain-community 0.4.2.
  "langchain-community>=0.4,<0.4.2",
  "markdown-it-py>=3,<5",
  "openai>=1.60,<3",
  "psycopg[binary]>=3.3.5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.15,<2",
  "ragas==0.4.3",
  "tokenizers>=0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
elite-rag-server = "elite_rag.cli:serve"
elite-rag = "elite_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elite_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["elite_rag"]
ignore_missing_imports = true
